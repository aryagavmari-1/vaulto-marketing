name: Refresh KPIs

# The measurement loop (ARY-403 / ARY-406). Runs scripts/pull-kpis.mjs on a
# cadence, pulling live numbers from the $0 analytics sources into kpis.json and
# committing the refresh back so the team + marketing sub-agents read live KPIs
# straight from the repo (see KPIS.md → "The optimisation loop").
#
# Cadence: weekly (KPIs are "/mo" baselines — daily noise isn't actionable yet)
# plus manual workflow_dispatch.
#
# Required repo secrets (NONE committed; provisioned once the live analytics
# accounts land — blocked on ARY-409):
#   CF_API_TOKEN                  — Cloudflare Web Analytics GraphQL (traffic)
#   CF_ACCOUNT_TAG  (optional)    — read back from the token when it sees one account
#   GSC_SERVICE_ACCOUNT_JSON      — Google Search Console service-account key
#   GSC_SITE_URL  (optional)      — GSC property, default https://myvaulto.com/
#
# These can be set without anyone sharing a credential value: whoever holds it
# runs `gh secret set <NAME> --repo aryagavmari-1/vaulto-marketing` and pastes at
# the prompt, then triggers this workflow. The value never enters an issue thread.
#
# Until those secrets exist the puller is a safe no-op (it leaves kpis.json
# unchanged and exits 0), so this job runs green and commits nothing. It goes
# live the moment the secrets are set — no code change needed.

on:
  schedule:
    - cron: '17 6 * * 1' # 06:17 UTC every Monday
  workflow_dispatch:
    inputs:
      # Activation (waitlist_signups) is now AUTO-SOURCED from the app's own
      # registration count on every scheduled run (ARY-2490): the puller reads
      # the token-gated backend endpoint KPI_SIGNUPS_URL. This manual input stays
      # as an override / correction lever only — Actions → Refresh KPIs → Run
      # workflow → paste a count to force that number for the run. Left blank,
      # the auto-source (KPI_SIGNUPS_URL secret) is used.
      waitlist_signups:
        description: 'Override waitlist signups (manual; blank = auto-source from the app)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: refresh-kpis
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Preflight first so the log says *which* credential is wrong and how to fix
      # it. The puller itself is deliberately quiet (a bad credential just leaves
      # kpis.json untouched), which is unreadable from CI. Never fails the job —
      # it is diagnostics, and it prints no secret values (ARY-556).
      - name: Preflight credentials
        continue-on-error: true
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_TAG: ${{ secrets.CF_ACCOUNT_TAG }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: node scripts/check-kpi-creds.mjs
      - name: Pull live KPIs
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_TAG: ${{ secrets.CF_ACCOUNT_TAG }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          # Activation auto-source (ARY-2490): the app's registration-count
          # endpoint + its read token. Set once as repo secrets; scheduled runs
          # then populate waitlist_signups with no human step. If the URL is set
          # but the fetch fails, the puller exits non-zero → this job goes RED
          # (never a silent null).
          KPI_SIGNUPS_URL: ${{ secrets.KPI_SIGNUPS_URL }}
          KPI_SIGNUPS_TOKEN: ${{ secrets.KPI_SIGNUPS_TOKEN }}
          # Optional manual override (workflow_dispatch): forces this number and
          # skips the auto-source for the run.
          KPI_WAITLIST_SIGNUPS: ${{ inputs.waitlist_signups }}
        run: node scripts/pull-kpis.mjs
      - name: Commit refreshed KPIs + GSC breakdown
        run: |
          set -euo pipefail
          # kpis.json = site aggregates; gsc-breakdown.{json,md} = per-page/query
          # breakdown (ARY-2489). Commit whichever the puller touched this run.
          FILES="kpis.json gsc-breakdown.json GSC-BREAKDOWN.md"
          if git diff --quiet -- $FILES; then
            echo "No KPI changes to commit."
            exit 0
          fi
          git config user.name  "vaulto-kpi-bot"
          git config user.email "noreply@paperclip.ing"
          git add $FILES
          git commit -m "chore(kpis): refresh live KPI snapshot + GSC breakdown [skip ci]

          Co-Authored-By: Paperclip <noreply@paperclip.ing>"
          git push
