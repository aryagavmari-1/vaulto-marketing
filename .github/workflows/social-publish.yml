name: Social Publish (manual-flag cycle)

# The FREE social publishing path (ARY-654). Runs the publisher once a day: reads
# every board-approved publish-manifest, works out which atoms are due on the
# Day-0..5 stagger, and flags each due atom `manual-required` (post from approved
# copy + graphic — Track 1). Idempotent publish-log is committed back each run
# (auditable history + no double-posts).
#
# v1 decision (CEO ARY-2281): Pinterest API automation is DROPPED for v1 —
# Pinterest posts manually like every other platform, so this job makes NO live
# platform calls and needs NO secrets. It exists to keep the projected publish-log
# (the manual-posting worklist) fresh and auditable. The Pinterest v5 adapter is
# kept dormant for a possible future revisit (see social-publisher/README.md).
#
# $0 by design: no paid SaaS, no new infra — the same scheduled-GitHub-Actions
# pattern the KPI puller already uses (see refresh-kpis.yml). GitHub Actions cron
# is free at this cadence. (A Render cron job can run the identical `node run.mjs`
# command if we ever prefer Render — the worker is portable.)

on:
  schedule:
    - cron: '13 9 * * *' # 09:13 UTC daily
  workflow_dispatch:
    inputs:
      today:
        description: 'Override run date (YYYY-MM-DD) — testing only'
        required: false
      dry_run:
        description: 'Force dry-run (no live posts)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: social-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: social-publisher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run unit tests
        run: node --test test/publisher.test.mjs
      - name: Flag due atoms for manual posting
        env:
          RUN_DATE: ${{ github.event.inputs.today }}
        run: |
          node run.mjs --all manifests ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
      - name: Commit publish-log write-back
        run: |
          set -euo pipefail
          if git diff --quiet -- publish-log; then
            echo "No publish-log changes to commit."
            exit 0
          fi
          git config user.name  "vaulto-social-bot"
          git config user.email "noreply@paperclip.ing"
          git add publish-log
          git commit -m "chore(social): publish-log write-back [skip ci]

          Co-Authored-By: Paperclip <noreply@paperclip.ing>"
          git push
