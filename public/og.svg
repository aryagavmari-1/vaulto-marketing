<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Calm olive (ARY-243 tokens): primary #4F6230 to primary-pressed #3F4E26.
         White body copy on the lighter stop is 6.73:1 AA. (ARY-972 retint.) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F6230"/>
      <stop offset="1" stop-color="#3F4E26"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="120" r="260" fill="#ffffff" opacity="0.05"/>
  <g transform="translate(90,90)">
    <rect width="56" height="56" rx="14" fill="#FAF6EF"/>
    <text x="76" y="38" fill="#FAF6EF" font-family="system-ui, sans-serif" font-size="30" font-weight="700">Vaulto</text>
  </g>
  <text x="90" y="320" fill="#ffffff" font-family="system-ui, sans-serif" font-size="62" font-weight="800" letter-spacing="-1.5">
    <tspan x="90" dy="0">Everything your family owns,</tspan>
    <tspan x="90" dy="74">in one private place.</tspan>
  </text>
  <text x="90" y="500" fill="#EAF0DE" font-family="system-ui, sans-serif" font-size="30" font-weight="500">
    Inventory · net worth · documents · AI guidance for life's big events
